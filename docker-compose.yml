services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-meet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meet}
      POSTGRES_DB: ${POSTGRES_DB:-meet_intelligence}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # -d matters: without it, pg_isready checks connectivity to a
      # database named after the user (POSTGRES_USER, "meet") rather than
      # the actual app database (POSTGRES_DB, "meet_intelligence") that
      # DATABASE_URL below actually connects to — a healthy check here
      # wasn't proving the thing every other service's `depends_on:
      # condition: service_healthy` actually needs.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meet} -d ${POSTGRES_DB:-meet_intelligence}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local S3-compatible storage. MinIO's own image now requires a paid Docker Hub
  # subscription to pull, so we use Zenko CloudServer here instead (free, same S3
  # API). Prod can point MINIO_ENDPOINT/keys at real MinIO, S3, or R2 unchanged.
  storage:
    image: zenko/cloudserver:latest
    environment:
      SCALITY_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-accessKey1}
      SCALITY_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-verySecretKey1}
    ports:
      - "9000:8000"
    volumes:
      - minio_data:/usr/src/app/localData
      - ./docker/zenko-config.json:/usr/src/app/config.json:ro
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8000/_/healthcheck', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-meet}:${POSTGRES_PASSWORD:-meet}@postgres:5432/${POSTGRES_DB:-meet_intelligence}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: storage:8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy
    volumes:
      - ./:/app
    command: >
      sh -c "alembic upgrade head && uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload"

  # Calendar poller + bot-pool reaper + bot-launcher. The launcher needs the
  # host's docker.sock (to start sibling bot containers — see
  # scheduler/bot_launcher.py's module docstring on why bind-mount paths
  # must be given in HOST terms) and HOST_PROJECT_DIR set to this repo's
  # absolute path on the host for that reason.
  scheduler:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-meet}:${POSTGRES_PASSWORD:-meet}@postgres:5432/${POSTGRES_DB:-meet_intelligence}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: storage:8000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./:/app
      - ./secrets:/app/secrets:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: python -m scheduler.main

  # Not started by `docker compose up` (profiles: manual) — built so its image
  # exists for the scheduler's bot-launcher to reference, and runnable by hand
  # for testing via `docker compose run --rm bot ...` (see README Phase 2).
  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    profiles: ["manual"]
    # Docker's default /dev/shm is 64MB, way too small for Chromium — causes
    # "Aw, Snap!" tab crashes. --disable-dev-shm-usage (below, in bot.py) is a
    # fallback; this is the real fix. Mirrored in scheduler/bot_launcher.py's
    # containers.run() for bots launched automatically.
    shm_size: "2gb"
    # Give the SIGTERM handler time to leave the call, stop ffmpeg, and
    # upload the recording before Docker SIGKILLs. Mirrored by
    # stop_timeout in scheduler/bot_launcher.py for auto-launched bots.
    stop_grace_period: 30s
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-meet}:${POSTGRES_PASSWORD:-meet}@postgres:5432/${POSTGRES_DB:-meet_intelligence}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: storage:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy
    volumes:
      - ./bot-profiles:/bot-profiles
      - ./recordings:/recordings

  # Phase 3: diarization worker. Consumes the Redis queue bot.py's
  # enqueue_processing pushes to (meeting ends -> recorded -> queued).
  # CPU-only for now (DIARIZATION_DEVICE in .env switches to GPU later —
  # a config change, not a rebuild, though GPU passthrough itself isn't
  # wired into this compose file yet since there's no GPU host to test
  # against). No docker.sock needed — unlike scheduler, this never
  # launches other containers.
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-meet}:${POSTGRES_PASSWORD:-meet}@postgres:5432/${POSTGRES_DB:-meet_intelligence}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: storage:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy
    volumes:
      - ./:/app
      # Persists the downloaded pyannote/HF model across restarts AND
      # across `docker compose run --rm worker ...` CLI invocations (each
      # of those is a fresh, disposable container — without this the
      # model would re-download from HF every single manual
      # process-meeting run).
      - worker_model_cache:/root/.cache
    command: python -m worker.main

  # Phase 4: transcription worker. Consumes the transcription queue
  # worker's diarization pushes to on success. Deliberately a SEPARATE
  # container/process from `worker` above — see
  # asr/transcription.py's module docstring (pyannote and the ASR
  # backends here must never be loaded in the same process at once).
  asr:
    build:
      context: .
      dockerfile: asr/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-meet}:${POSTGRES_PASSWORD:-meet}@postgres:5432/${POSTGRES_DB:-meet_intelligence}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: storage:8000
      # Diarization (worker/Dockerfile) stays pinned to 1 thread — that's
      # the pyannote-specific OOM fix from Phase 3. This container runs a
      # completely separate process; confirmed live it was only using 1 of
      # 10 available Docker Desktop cores (99% CPU on one core, 6.3/10.7GiB
      # memory headroom unused) because these were hardcoded to 1 here too.
      # ASR_NUM_THREADS (default 8, see common/config.py) leaves 2 cores
      # for macOS + the other containers.
      OMP_NUM_THREADS: ${ASR_NUM_THREADS:-8}
      MKL_NUM_THREADS: ${ASR_NUM_THREADS:-8}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy
    volumes:
      - ./:/app
      - asr_model_cache:/root/.cache
    command: python -m asr.main

volumes:
  postgres_data:
  minio_data:
  worker_model_cache:
  asr_model_cache:
